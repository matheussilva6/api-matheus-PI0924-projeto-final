version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ExternalApis__ImposterBaseUrl=http://imposter:4545
      - Redis__ConnectionString=redis:6379
    depends_on:
      - imposter
      - redis

  imposter:
    image: bbyars/mountebank:2.9.1
    command: ["mb", "start", "--configfile", "/imposter/imposter.json", "--allowInjection"]
    ports:
      - "2525:2525"
      - "4545:4545"
    volumes:
      - ./ApiMatheusProjetoFinal/imposter:/imposter

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
